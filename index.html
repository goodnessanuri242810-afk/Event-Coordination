<!-- the team Team Hub · v2 bright SaaS -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cobalt:#3E9E5E; --cobalt-soft:#E7F5EC; --cobalt-deep:#2E7A48;
    --amber:#E8B93E; --amber-soft:#FCF4DE; --amber-deep:#B78A15;
    --ink:#1A1C23; --slate:#6E7280; --faint:#9CA0AC;
    --bg:#F8FBF6; --card:#FFFFFF; --line:#E6EFE4;
    --ok:#18A05B; --ok-soft:#E3F6EC; --danger:#D6493B;
    --r:22px; --shadow:0 1px 2px rgba(26,28,35,.04), 0 10px 30px -12px rgba(62,158,94,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  .ow-app{font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg); min-height:680px; border-radius:18px; overflow:hidden;}
  .gate{position:fixed; inset:0; background:linear-gradient(135deg,var(--cobalt),var(--cobalt-deep)); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; font-family:'Inter',sans-serif;}
  .gate-card{background:#fff; border-radius:22px; padding:38px 34px; width:100%; max-width:360px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.25);}
  .gate-mark{width:54px; height:54px; border-radius:16px; background:linear-gradient(135deg,var(--cobalt),var(--cobalt-deep)); color:#fff; font:800 20px 'Plus Jakarta Sans',sans-serif; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
  .gate-card h2{font:800 21px 'Plus Jakarta Sans',sans-serif; letter-spacing:-.01em; margin-bottom:4px;}
  .gate-sub{color:var(--slate); font-size:13.5px; margin-bottom:20px;}
  .gate-card input{font:600 18px 'Inter',sans-serif; text-align:center; letter-spacing:.3em; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:13px; width:100%; outline:none;}
  .gate-card input:focus{border-color:var(--cobalt);}
  .gate-err{color:var(--danger); font:600 12.5px 'Inter',sans-serif; min-height:18px; margin-top:10px;}
  .gate-hint{color:var(--faint); font-size:11.5px; margin-top:4px;}
  /* ---------- Top bar ---------- */
  .top{display:flex; align-items:center; gap:20px; padding:18px 30px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .logo{display:flex; align-items:center; gap:11px;}
  .logo .mark{width:40px; height:40px; border-radius:13px; background:linear-gradient(135deg,var(--cobalt),var(--cobalt-deep)); color:#fff; display:flex; align-items:center; justify-content:center; font:800 15px 'Plus Jakarta Sans',sans-serif; box-shadow:0 6px 14px -6px rgba(36,64,224,.5);}
  .logo b{font:800 16px 'Plus Jakarta Sans',sans-serif; letter-spacing:-.01em; display:block;}
  .logo small{font:600 10.5px 'Inter',sans-serif; color:var(--faint); letter-spacing:.06em; text-transform:uppercase;}
  .ow-nav{display:flex; gap:4px; background:var(--bg); padding:5px; border-radius:99px; margin-left:auto; overflow-x:auto; max-width:100%;}
  .ow-nav button{border:0; background:none; cursor:pointer; font:600 13px 'Inter',sans-serif; color:var(--slate); padding:9px 16px; border-radius:99px; white-space:nowrap; transition:all .15s;}
  .ow-nav button:hover{color:var(--ink);}
  .ow-nav button.on{background:var(--card); color:var(--cobalt); box-shadow:0 2px 8px rgba(26,28,35,.08);}
  /* ---------- Main ---------- */
  .ow-main{padding:34px 34px 44px; max-width:1180px; margin:0 auto;}
  .eyebrow{display:inline-block; font:700 11px 'Inter',sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--cobalt); background:var(--cobalt-soft); padding:6px 13px; border-radius:99px; margin-bottom:14px;}
  h1.big{font:800 34px 'Plus Jakarta Sans',sans-serif; letter-spacing:-.025em; line-height:1.08;}
  .sub{color:var(--slate); font-size:14px; line-height:1.6; margin-top:10px; max-width:600px;}
  .section-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap;}
  /* ---------- Cards & stats ---------- */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:18px; margin:30px 0;}
  .stat{background:var(--card); border-radius:var(--r); padding:24px; box-shadow:var(--shadow);}
  .stat .chip{width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:16px;}
  .stat.blue .chip{background:var(--cobalt-soft);} .stat.gold .chip{background:var(--amber-soft);}
  .stat b{font:800 30px 'Plus Jakarta Sans',sans-serif; letter-spacing:-.02em; display:block; margin-bottom:4px;}
  .stat span{font-size:12.5px; color:var(--slate); font-weight:500;}
  .panel{background:var(--card); border-radius:var(--r); padding:26px; box-shadow:var(--shadow);}
  .panel h3{font:800 16px 'Plus Jakarta Sans',sans-serif; letter-spacing:-.01em; margin-bottom:18px;}
  .grid-2{display:grid; grid-template-columns:1.25fr .75fr; gap:18px;}
  /* ---------- Buttons, inputs ---------- */
  .btn{border:0; cursor:pointer; font:600 13.5px 'Inter',sans-serif; padding:11px 20px; border-radius:13px; transition:all .15s;}
  .btn:hover{transform:translateY(-1px);}
  .btn.amber{background:var(--amber); color:#fff; box-shadow:0 6px 14px -6px rgba(232,185,62,.5);}
  .btn.blue{background:var(--cobalt); color:#fff; box-shadow:0 6px 14px -6px rgba(36,64,224,.5);}
  .btn.ghost{background:var(--card); border:1.5px solid var(--line); color:var(--ink);}
  .btn.tiny{padding:6px 13px; font-size:12px; border-radius:10px;}
  .icon-btn{border:0; background:none; cursor:pointer; color:var(--faint); font-size:13px; padding:5px; border-radius:8px;}
  .icon-btn:hover{color:var(--danger); background:#FBEFED;}
  input[type=text],input[type=date],input[type=month],input[type=number],select,textarea{font:500 13.5px 'Inter',sans-serif; color:var(--ink); background:var(--bg); border:1.5px solid transparent; border-radius:12px; padding:11px 14px; width:100%; outline:none; transition:all .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--cobalt); background:var(--card);}
  label.f{display:block; font:600 11px 'Inter',sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--slate); margin:14px 0 6px;}
  /* ---------- Tags ---------- */
  .tag{display:inline-block; font:600 11px 'Inter',sans-serif; padding:4px 11px; border-radius:99px;}
  .tag.ch{background:var(--cobalt-soft); color:var(--cobalt);}
  .tag.st-planning{background:#F0F1F4; color:#5A5D68;}
  .tag.st-vendors-booked{background:#FBF2E2; color:#B0742C;}
  .tag.st-confirmations{background:#FBF6E2; color:#9A6E12;}
  .tag.st-ready{background:#E9F5EF; color:#2E7A5A;}
  .tag.st-live{background:#FBE9E6; color:#C0492E;}
  .tag.st-debrief{background:#F1ECFB; color:#6E3ED6;}
  .tag.st-recap-sent{background:var(--ok-soft); color:var(--ok);}
  /* ---------- Kanban board ---------- */
  .viewtabs{display:inline-flex; gap:4px; background:var(--bg); padding:5px; border-radius:99px; margin-bottom:20px;}
  .viewtabs button{border:0; background:none; cursor:pointer; font:600 12.5px 'Inter',sans-serif; color:var(--slate); padding:8px 16px; border-radius:99px;}
  .viewtabs button.on{background:var(--card); color:var(--cobalt); box-shadow:0 2px 8px rgba(26,28,35,.08);}
  .kboard{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(300px,1fr); gap:16px; overflow-x:auto; padding-bottom:12px; align-items:start;}
  .pstats{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .pstat{background:var(--card); border-radius:14px; padding:12px 18px; box-shadow:var(--shadow); min-width:104px;}
  .pstat b{font:800 22px 'Plus Jakarta Sans',sans-serif; display:block; letter-spacing:-.02em;}
  .pstat span{font-size:11.5px; color:var(--slate); font-weight:600;}
  .pstat.warn b{color:var(--danger);}
  .kover{color:var(--danger); font-weight:700;}
  .qlist{display:flex; flex-direction:column; gap:2px;}
  .qgroup{margin-bottom:14px;}
  .qgroup:last-child{margin-bottom:0;}
  .qghead{font:800 12px 'Plus Jakarta Sans',sans-serif; letter-spacing:.02em; color:var(--cobalt); background:var(--cobalt-soft); display:inline-block; padding:5px 13px; border-radius:99px; margin-bottom:6px;}
  .qrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .qrow:last-child{border-bottom:0;}
  .qinfo{min-width:0; flex:1;}
  .qinfo b{font:600 13.5px 'Inter',sans-serif; display:block;}
  .qurl{font-size:12px; color:var(--cobalt); text-decoration:none; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:520px;}
  .qurl:hover{text-decoration:underline;}
  .qacts{display:flex; align-items:center; gap:4px; flex-shrink:0;}
  .kcol{background:var(--bg); border-radius:16px; padding:12px 11px; min-height:120px; transition:background .15s;}
  .kcol.over{background:var(--cobalt-soft); outline:2px dashed var(--cobalt); outline-offset:-2px;}
  .kcol h4{display:flex; align-items:center; justify-content:space-between; font:800 12.5px 'Plus Jakarta Sans',sans-serif; padding:2px 6px 12px; letter-spacing:-.01em;}
  .kcol h4 .kc{font:700 11px 'Inter',sans-serif; color:var(--slate); background:var(--card); padding:2px 9px; border-radius:99px;}
  .kcard{background:var(--card); border-radius:14px; padding:18px 18px; margin-bottom:13px; box-shadow:0 1px 3px rgba(26,28,35,.07); cursor:grab; border-left:4px solid var(--line);}
  .kcard:active{cursor:grabbing;}
  .kcard.drag{opacity:.4;}
  .kcard .kt{font:600 15px 'Inter',sans-serif; line-height:1.45; color:var(--ink); margin-bottom:11px;}
  .kcard .kmeta{display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  .pgbadge{font:700 10px 'Inter',sans-serif; padding:3px 9px 3px 8px; border-radius:99px; cursor:pointer; border:0; display:inline-flex; align-items:center; gap:4px; user-select:none;}
  .pgbadge::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.85;}
  .pgbadge:hover{filter:brightness(.96);}
  .pgbadge.pg-todo{background:#EEEFF2; color:#6B6E78;}
  .pgbadge.pg-doing{background:#FFF1DE; color:#B0730E;}
  .pgbadge.pg-review{background:#EFE6FC; color:#6E3ED6;}
  .pgbadge.pg-done{background:#E3F6EC; color:#18A05B;}
  .kcard .kfoot{display:flex; justify-content:space-between; align-items:center; margin-top:9px;}
  .kcard .klinks{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px;}
  .kcard .klink{font:600 10.5px 'Inter',sans-serif; text-decoration:none; color:var(--cobalt); background:var(--cobalt-soft); padding:3px 9px; border-radius:6px; display:inline-flex; align-items:center; gap:3px;}
  .kcard .klink::before{content:"🔗"; font-size:9px;}
  .kcard .klink:hover{filter:brightness(.95); text-decoration:underline;}
  .kcard .kown{font:600 11px 'Inter',sans-serif; color:var(--slate);}
  .kcard .kbtns{display:flex; gap:1px; opacity:0; transition:opacity .15s;}
  .kcard:hover .kbtns{opacity:1;}
  .kcard .kbtns .icon-btn{font-size:12px; padding:3px 4px;}
  .kcard .kbtns .icon-btn.ed:hover{color:var(--cobalt); background:var(--cobalt-soft);}
  .kempty{color:var(--faint); font-size:11.5px; text-align:center; padding:12px 4px;}
  .kmove{display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:9px; border-top:1px solid var(--line); gap:6px;}
  .karrow{border:1.5px solid var(--line); background:var(--card); cursor:pointer; font:700 12px 'Inter',sans-serif; color:var(--cobalt); padding:5px 12px; border-radius:8px; display:inline-flex; align-items:center; gap:4px; transition:all .15s;}
  .karrow:hover{background:var(--cobalt-soft); border-color:var(--cobalt);}
  .karrow[disabled]{opacity:.3; cursor:default; color:var(--faint);}
  .karrow[disabled]:hover{background:var(--card); border-color:var(--line);}
  /* ---------- Calendar ---------- */
  .cal-head{display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .cal-title{font:800 19px 'Plus Jakarta Sans',sans-serif; min-width:170px; letter-spacing:-.01em;}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:9px;}
  .cal .dow{font:700 10.5px 'Inter',sans-serif; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); text-align:center; padding:6px 0;}
  .day{background:var(--bg); border:1.5px solid transparent; border-radius:15px; min-height:86px; padding:9px 10px; font-size:11px; cursor:pointer; transition:all .15s;}
  .day:hover{border-color:var(--cobalt); background:var(--card);}
  .day.out{opacity:.3; cursor:default; background:transparent;}
  .day .n{font:700 12.5px 'Plus Jakarta Sans',sans-serif; color:var(--ink);}
  .day.today{background:var(--card); border-color:var(--cobalt); box-shadow:0 4px 12px -4px rgba(36,64,224,.25);}
  .day.today .n{background:var(--cobalt); color:#fff; border-radius:8px; padding:2px 8px; display:inline-block;}
  .day.prayer{background:var(--amber-soft);}
  .day.prayer::after{content:'📊 Monthly Review'; display:block; font:600 9.5px 'Inter',sans-serif; color:var(--amber-deep); margin-top:5px;}
  .ev{display:block; background:var(--cobalt-soft); color:var(--cobalt); border-radius:7px; padding:3px 7px; margin-top:4px; font-weight:600; font-size:9.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* ---------- Tables ---------- */
  table.tbl{width:100%; border-collapse:collapse; font-size:13px;}
  .tbl th{font:700 10.5px 'Inter',sans-serif; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); text-align:left; padding:10px 12px; border-bottom:1.5px solid var(--line);}
  .tbl td{padding:14px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  .tbl tr:last-child td{border-bottom:0;}
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  .filters select{width:auto; background:var(--card); box-shadow:var(--shadow); border:0;}
  /* ---------- Team ---------- */
  .team-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px;}
  .member{background:var(--card); border-radius:var(--r); padding:26px; position:relative; box-shadow:var(--shadow);}
  .member .avatar{width:52px; height:52px; border-radius:17px; background:linear-gradient(135deg,var(--cobalt),var(--cobalt-deep)); color:#fff; font:800 19px 'Plus Jakarta Sans',sans-serif; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .member:nth-child(2n) .avatar{background:linear-gradient(135deg,#EBC85A,#E8B93E);}
  .member h4{font:800 15.5px 'Plus Jakarta Sans',sans-serif; letter-spacing:-.01em;}
  .member .role{color:var(--cobalt); font-weight:600; font-size:12.5px; margin:4px 0 10px;}
  .member p{font-size:12.5px; color:var(--slate); line-height:1.6;}
  .member .tools{position:absolute; top:18px; right:18px; display:flex; gap:3px;}
  /* ---------- Tasks ---------- */
  .task-cols{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px;}
  .tcol{background:var(--card); border-radius:var(--r); padding:22px; box-shadow:var(--shadow);}
  .tcol h4{font:800 14px 'Plus Jakarta Sans',sans-serif; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
  .tcol h4 em{font:600 11px 'Inter',sans-serif; color:var(--cobalt); font-style:normal; background:var(--cobalt-soft); padding:3px 9px; border-radius:99px;}
  .task{display:flex; align-items:flex-start; gap:9px; padding:8px 8px; border-radius:10px; font-size:13px;}
  .task:hover{background:var(--bg);}
  .task input[type=checkbox]{margin-top:2px; accent-color:var(--cobalt); width:15px; height:15px; cursor:pointer;}
  .task.done span{text-decoration:line-through; color:var(--faint);}
  .task span{flex:1; line-height:1.45;}
  .addline{display:flex; gap:8px; margin-top:12px;}
  .addline input{padding:9px 12px; font-size:12.5px;}
  /* ---------- Notes wall ---------- */
  .notes-wall{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px;}
  .note{background:var(--card); border-radius:var(--r); padding:24px; box-shadow:var(--shadow); border-top:4px solid var(--amber);}
  .note:nth-child(3n+2){border-top-color:var(--cobalt);}
  .note .who{font:800 14px 'Plus Jakarta Sans',sans-serif;}
  .note .wk{font:600 11px 'Inter',sans-serif; color:var(--faint); margin:3px 0 12px;}
  .note p{font-size:13px; line-height:1.6; white-space:pre-wrap; color:#3A3D47;}
  /* ---------- Analytics ---------- */
  .bars{display:flex; align-items:flex-end; gap:14px; height:180px; padding:12px 6px 0; border-bottom:1.5px solid var(--line);}
  .bar{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:7px; min-width:36px;}
  .bar i{display:block; width:100%; max-width:48px; background:linear-gradient(180deg,var(--cobalt),var(--cobalt-deep)); border-radius:10px 10px 4px 4px; transition:height .4s;}
  .bar b{font:700 11px 'Plus Jakarta Sans',sans-serif;}
  .bar-x{display:flex; gap:14px; padding:8px 6px 0;}
  .bar-x span{flex:1; min-width:36px; text-align:center; font:600 10.5px 'Inter',sans-serif; color:var(--faint);}
  /* ---------- Schedule ---------- */
  .sched{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(200px,1fr); gap:14px; overflow-x:auto; padding-bottom:10px;}
  .sday{background:var(--card); border-radius:var(--r); padding:16px 14px; box-shadow:var(--shadow); border:1.5px solid transparent; min-width:200px;}
  .sday.now{border-color:var(--cobalt);}
  .sday h4{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .sday h4 .dpill{font:700 12px 'Plus Jakarta Sans',sans-serif; background:#E4EFE6; color:#3E6B4A; padding:4px 12px; border-radius:8px;}
  .sday.now h4 .dpill{background:var(--cobalt-soft); color:var(--cobalt);}
  .sday h4 .cnt{font:600 12px 'Inter',sans-serif; color:var(--faint);}
  .slot{border-radius:13px; padding:12px 13px; margin-bottom:10px; background:var(--bg); box-shadow:0 1px 2px rgba(26,28,35,.05); position:relative;}
  .slot .del{position:absolute; top:8px; right:8px; opacity:0; transition:opacity .15s;}
  .slot:hover .del{opacity:1;}
  .slot .ti{font:600 13px 'Inter',sans-serif; color:var(--ink); line-height:1.4; padding-right:16px;}
  .slot .time{font:500 12px 'Inter',sans-serif; color:#4A4D57; margin-top:8px;}
  .slot .tag{margin-top:7px;}
  .slot.c-meeting{background:#FBEAEA;} .tag.c-meeting{background:#F6CFCF; color:#A33B3B;}
  .slot.c-personal{background:#FCF4DE;} .tag.c-personal{background:#F3E3AC; color:#8A6A12;}
  .slot.c-video{background:#FBEAF2;} .tag.c-video{background:#F3CCE0; color:#A83A74;}
  .slot.c-work{background:#F2EFE9;} .tag.c-work{background:#E1D9C8; color:#6E5F3E;}
  .slot.c-course{background:#F5EEE4;} .tag.c-course{background:#E8D8BC; color:#8A6B33;}
  .slot.c-brainstorming{background:#F2ECFB;} .tag.c-brainstorming{background:#DFD0F5; color:#6E42B8;}
  .slot.c-activity{background:#E9F5EC;} .tag.c-activity{background:#CBE8D3; color:#2F7A47;}
  .slot.c-content{background:#E9F1FB;} .tag.c-content{background:#CCDFF5; color:#2860A8;}
  .slot .tools2{position:absolute; top:7px; right:7px; display:flex; gap:1px; opacity:0; transition:opacity .15s;}
  .slot:hover .tools2{opacity:1;}
  .slot .tools2 .icon-btn{font-size:11.5px; padding:4px;}
  .slot .tools2 .icon-btn.ed:hover{color:var(--cobalt); background:var(--cobalt-soft);}
  .tslot{margin-bottom:12px;}
  .tlabel{display:flex; justify-content:space-between; align-items:center; font:700 10px 'Inter',sans-serif; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); padding:0 2px 5px; border-bottom:1px dashed var(--line); margin-bottom:7px;}
  .tlabel button{border:0; background:none; cursor:pointer; color:var(--faint); font:600 13px 'Inter',sans-serif; padding:0 3px; border-radius:5px; line-height:1;}
  .tlabel button:hover{color:var(--cobalt); background:var(--cobalt-soft);}
  .tag.a-brand-partner{background:var(--cobalt-soft); color:var(--cobalt);}
  .tag.a-creator{background:var(--amber-soft); color:var(--amber-deep);}
  .tag.a-sponsor{background:#EDE6FB; color:#6E3ED6;}
  /* ---------- Progress & today & mini stats ---------- */
  .pbar{height:6px; background:var(--bg); border-radius:99px; overflow:hidden; margin-bottom:12px;}
  .pbar i{display:block; height:100%; background:linear-gradient(90deg,var(--cobalt),var(--amber)); border-radius:99px; transition:width .3s;}
  .trow{display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .trow:last-child{border-bottom:0;}
  .trow b.t{font:700 12px 'Plus Jakarta Sans',sans-serif; color:var(--amber-deep); min-width:92px; padding-top:2px;}
  .trow .tt{flex:1; line-height:1.45;}
  .mini{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:18px;}
  .mini .m{background:var(--bg); border-radius:16px; padding:16px 18px;}
  .mini .m b{font:800 21px 'Plus Jakarta Sans',sans-serif; letter-spacing:-.02em;}
  .mini .m span{display:block; font-size:11.5px; color:var(--slate); font-weight:600; margin-top:3px;}
  .delta{font:700 11px 'Inter',sans-serif; padding:2px 8px; border-radius:99px; margin-left:7px; vertical-align:3px;}
  .delta.up{background:var(--ok-soft); color:var(--ok);} .delta.down{background:#FBEBE9; color:var(--danger);} .delta.flat{background:#F0F1F4; color:#5A5D68;}
  /* ---------- Modal & toast ---------- */
  .modal-bg{position:fixed; inset:0; background:rgba(26,28,35,.45); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:18px;}
  .modal{background:var(--card); border-radius:24px; padding:28px; width:100%; max-width:440px; max-height:88vh; overflow:auto; box-shadow:0 24px 60px -12px rgba(26,28,35,.3);}
  .modal h3{font:800 18px 'Plus Jakarta Sans',sans-serif; letter-spacing:-.01em; margin-bottom:4px;}
  .modal .row{display:flex; gap:12px;} .modal .row>div{flex:1;}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:24px;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font:600 13px 'Inter',sans-serif; padding:12px 22px; border-radius:99px; z-index:60; opacity:0; transition:opacity .25s; box-shadow:0 10px 30px rgba(26,28,35,.3);}
  .toast.show{opacity:1;}
  .empty{color:var(--faint); font-size:13px; padding:26px 6px; text-align:center;}
  .muted{color:var(--faint); font-size:11.5px;}
  .loading{padding:70px; text-align:center; color:var(--faint); font-size:13.5px;}
  @media(max-width:760px){
    .top{padding:14px 16px; gap:12px;}
    .ow-nav{margin-left:0; width:100%;}
    .ow-main{padding:22px 16px 34px;}
    .grid-2{grid-template-columns:1fr;}
    h1.big{font-size:26px;}
    .day{min-height:58px; border-radius:11px;}
    .stats{gap:12px;} .stat{padding:18px;}
  }
</style>

<div class="ow-app">
  <header class="top">
    <div class="logo">
      <div class="mark">🍋</div>
      <div><b>Event Hub</b><small>Event Coordination</small></div>
    </div>
    <nav class="ow-nav" id="nav"></nav>
      <button class="btn ghost tiny" id="lock" title="Lock the hub">🔒</button>
  </header>
  <main class="ow-main">
    <div class="view" id="view"><div class="loading">Opening Event Hub…</div></div>
  </main>
</div>
<div id="gate" class="gate" style="display:none;">
  <div class="gate-card">
    <div class="gate-mark">🍋</div>
    <h2>Event Hub</h2>
    <p class="gate-sub">Enter the team PIN to continue.</p>
    <input type="password" id="gate-pin" inputmode="numeric" placeholder="Team PIN" autocomplete="off">
    <button class="btn blue" id="gate-go" style="width:100%; margin-top:12px;">Enter Hub</button>
    <p class="gate-err" id="gate-err"></p>
    <p class="gate-hint" id="gate-hint"></p>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  /* ================= constants ================= */
  const CHANNELS=["Conference","Trade Show","Brand Activation","Creator Event","Meet & Greet","Webinar","Sponsor Booth","Partner Dinner"];
  const STATUSES=["Planning","Vendors Booked","Confirmations","Ready","Live","Debrief","Recap Sent"];
  const PROGRESS=["To Do","Doing","Review","Done"];
  function progCls(p){return "pg-"+String(p||"To Do").toLowerCase().replace(/[^a-z]/g,"");}
  function stCls(s){return "st-"+String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const NAV=[["dash","Dashboard"],["schedule","Schedule"],["calendar","Calendar"],["bank","Events"],["analytics","Analytics"],["team","Team"],["tasks","Weekly Tasks"],["notes","Friday Notes"]];
  const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const CATS=["Meeting","Personal","Video","Work","Course","Brainstorming","Activity","Content"];
  const ACCOUNTS=["Brand Partner","Creator","Sponsor"];
  const TIMES=["6:00 AM","10:00 AM","12:00 PM","2:00 PM","4:00 PM","6:00 PM"];
  const QL_GROUPS=["Event Templates","Partner Resources"];
  const _d=(off)=>{const x=new Date(); x.setDate(x.getDate()+off); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
  const SEED_EVENTS=[
    {id:"e1",title:"VetCon Booth Activation — Austin",channel:"Conference",account:"Sponsor",status:"Planning",owner:"Eden",date:_d(30),progress:"Doing"},
    {id:"e2",title:"Pet Expo Meet & Greet — Orlando",channel:"Trade Show",account:"Creator",status:"Vendors Booked",owner:"Eden",date:_d(21),progress:"Doing"},
    {id:"e3",title:"Brand Partner Dinner — Chicago",channel:"Partner Dinner",account:"Brand Partner",status:"Confirmations",owner:"Eden",date:_d(14),progress:"Review"},
    {id:"e4",title:"Creator Content Day — Los Angeles",channel:"Creator Event",account:"Creator",status:"Ready",owner:"Eden",date:_d(7),progress:"Doing"},
    {id:"e5",title:"Animal Care Summit Panel — Denver",channel:"Conference",account:"Sponsor",status:"Live",owner:"Eden",date:_d(0),progress:"Doing"},
    {id:"e6",title:"Spring Sponsor Showcase — Nashville",channel:"Brand Activation",account:"Sponsor",status:"Debrief",owner:"Eden",date:_d(-5),progress:"Doing"},
    {id:"e7",title:"Q1 Creator Launch Event — Remote",channel:"Webinar",account:"Creator",status:"Recap Sent",owner:"Eden",date:_d(-20),progress:"Done"}
  ];
  const SEED_LINKS=[
    {id:"l1",group:"Event Templates",label:"Event checklist template",url:""},
    {id:"l2",group:"Event Templates",label:"Run-of-show template",url:""},
    {id:"l3",group:"Event Templates",label:"Vendor contact sheet",url:""},
    {id:"l4",group:"Event Templates",label:"Post-event recap template",url:""},
    {id:"l5",group:"Partner Resources",label:"Sponsor deck",url:""},
    {id:"l6",group:"Partner Resources",label:"Brand guidelines",url:""},
    {id:"l7",group:"Partner Resources",label:"Creator one-sheets",url:""},
    {id:"l8",group:"Partner Resources",label:"Shared event photos",url:""}
  ];
  const SEED_TEAM=[
    {id:"t1",name:"Agency Lead",role:"Talent Management",duties:"Creator relationships, partnerships, approvals."},
    {id:"t2",name:"Eden",role:"Event Coordinator",duties:"Owns event logistics end to end: timelines, vendors, confirmations, on-site details, partner recaps."},
    {id:"t3",name:"Brand Partner Contact",role:"Sponsor Liaison",duties:"Point of contact for brand and sponsor requirements."},
    {id:"t4",name:"Creator Talent",role:"Featured Creator",duties:"Appearances, content, and activations at events."}
  ];

  /* ================= state ================= */
  const S={team:null,content:null,events:null,notes:null,analytics:null,schedule:null,quicklinks:null,tasks:{},view:"dash",
    calY:new Date().getFullYear(),calM:new Date().getMonth(),
    weekMon:mondayOf(new Date()),
    fCh:"",fSt:"",fOw:"", chartCh:CHANNELS[0], chartMetric:"views", schedOw:"", bankView:"board", bankQ:"", bankMine:""};
  let dragId=null;
  const mem={};

  /* ================= storage (local, template demo) ================= */
  async function sGet(key,fb){
    try{const v=localStorage.getItem("event-hub:"+key); return v!==null? JSON.parse(v): fb;}
    catch(e){return key in mem? mem[key]: fb;}
  }
  async function sSet(key,val){
    mem[key]=val;
    try{localStorage.setItem("event-hub:"+key,JSON.stringify(val));}
    catch(e){toast("Saved for this session only");}
  }

  /* ================= date helpers ================= */
  function mondayOf(d){const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x;}
  function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function lastSunday(y,m){const d=new Date(y,m+1,0); d.setDate(d.getDate()-d.getDay()); return d;}
  function fmtShort(d){return MONTHS[d.getMonth()].slice(0,3)+" "+d.getDate();}
  function weekLabel(mon){const end=new Date(mon); end.setDate(end.getDate()+6); return fmtShort(mon)+" – "+fmtShort(end)+", "+end.getFullYear();}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

  /* ================= toast ================= */
  let toastT; function toast(msg){const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400);}

  /* ================= nav ================= */
  const navEl=document.getElementById("nav");
  navEl.innerHTML=NAV.map(n=>`<button data-v="${n[0]}">${n[1]}</button>`).join("");
  navEl.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b)return; S.view=b.dataset.v; render();});

  /* ================= data loading ================= */
  async function ensure(keys){
    const jobs=[];
    if(keys.includes("team")&&S.team===null) jobs.push(sGet("ow:team",null).then(v=>{S.team=v||SEED_TEAM.slice(); if(!v) sSet("ow:team",S.team);}));
    if(keys.includes("content")&&S.content===null) jobs.push(sGet("ow:content",[]).then(v=>S.content=(v&&v.length)?v:SEED_EVENTS.slice()));
    if(keys.includes("events")&&S.events===null) jobs.push(sGet("ow:events",[]).then(v=>S.events=v));
    if(keys.includes("notes")&&S.notes===null) jobs.push(sGet("ow:notes",[]).then(v=>S.notes=v));
    if(keys.includes("analytics")&&S.analytics===null) jobs.push(sGet("ow:analytics",[]).then(v=>S.analytics=v));
    if(keys.includes("schedule")&&S.schedule===null) jobs.push(sGet("ow:schedule",[]).then(v=>S.schedule=v));
    if(keys.includes("quicklinks")&&S.quicklinks===null) jobs.push(sGet("ow:quicklinks",null).then(v=>S.quicklinks=v||SEED_LINKS.slice()));
    if(keys.includes("tasks")){const k=ymd(S.weekMon); if(!(k in S.tasks)) jobs.push(sGet("ow:tasks:"+k,[]).then(v=>S.tasks[k]=v));}
    await Promise.all(jobs);
  }

  /* ================= modal ================= */
  const modalRoot=document.getElementById("modal-root");
  function openModal(html,onSave,saveLabel){
    modalRoot.innerHTML=`<div class="modal-bg"><div class="modal">${html}
      <div class="modal-foot"><button class="btn ghost" id="m-cancel">Cancel</button>
      <button class="btn blue" id="m-save">${saveLabel||"Save"}</button></div></div></div>`;
    modalRoot.querySelector("#m-cancel").onclick=closeModal;
    modalRoot.querySelector(".modal-bg").addEventListener("click",e=>{if(e.target.classList.contains("modal-bg"))closeModal();});
    modalRoot.querySelector("#m-save").onclick=async()=>{const ok=await onSave(); if(ok!==false) closeModal();};
  }
  function closeModal(){modalRoot.innerHTML="";}
  function mv(id){const el=modalRoot.querySelector("#"+id); return el? el.value.trim(): "";}
  function chOpts(sel){return CHANNELS.map(c=>`<option ${c===sel?"selected":""}>${c}</option>`).join("");}
  function stOpts(sel){return STATUSES.map(c=>`<option ${c===sel?"selected":""}>${c}</option>`).join("");}
  function teamOpts(sel){return S.team.map(t=>`<option ${t.name===sel?"selected":""}>${esc(t.name)}</option>`).join("");}
  function acOpts(sel){return ACCOUNTS.map(a=>`<option ${a===sel?"selected":""}>${a}</option>`).join("");}
  function aCls(a){return "a-"+String(a||"").toLowerCase().replace(/[^a-z]/g,"");}

  /* ================= views ================= */
  const V=document.getElementById("view");

  async function render(){
    navEl.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
    V.innerHTML='<div class="loading">Loading…</div>';
    if(S.view==="dash") await vDash();
    else if(S.view==="schedule") await vSchedule();
    else if(S.view==="calendar") await vCal();
    else if(S.view==="bank") await vBank();
    else if(S.view==="analytics") await vAnalytics();
    else if(S.view==="team") await vTeam();
    else if(S.view==="tasks") await vTasks();
    else if(S.view==="notes") await vNotes();
  }

  /* ---------- Dashboard ---------- */
  async function vDash(){
    await ensure(["team","content","notes","events","tasks","schedule","quicklinks"]);
    const now=new Date();
    const pd=lastSunday(now.getFullYear(),now.getMonth());
    let nextPd=pd; if(pd<new Date(now.getFullYear(),now.getMonth(),now.getDate())) nextPd=lastSunday(now.getFullYear()+(now.getMonth()===11?1:0),(now.getMonth()+1)%12);
    const daysTo=Math.round((nextPd-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
    const wk=S.tasks[ymd(S.weekMon)]||[];
    const done=wk.filter(t=>t.done).length;
    const pubM=S.content.filter(c=>c.status==="Published"&&c.date&&c.date.slice(0,7)===ymd(now).slice(0,7)).length;
    const recent=S.notes.slice(0,3);
    const dayName=DAYS[(now.getDay()+6)%7];
    const slotIdx=s=>{const i=TIMES.indexOf(s.slot); return i===-1?99:i;};
    const todayBlocks=S.schedule.filter(s=>s.day===dayName).sort((a,b)=>slotIdx(a)-slotIdx(b));
    const todayEvents=S.events.filter(e=>e.date===ymd(now));
    const isPrayer=ymd(lastSunday(now.getFullYear(),now.getMonth()))===ymd(now);
    const todayHtml=(todayBlocks.length||todayEvents.length||isPrayer)? `
      ${isPrayer?'<div class="trow"><b class="t">All day</b><span class="tt">📊 Monthly Review — event performance & process improvements</span></div>':""}
      ${todayEvents.map(e=>`<div class="trow"><b class="t">Event</b><span class="tt">${esc(e.title)} <span class="tag ch" style="margin-left:6px;">${esc(e.channel)}</span>${e.account?` <span class="tag ${aCls(e.account)}" style="margin-left:4px;">${esc(e.account)}</span>`:""}</span></div>`).join("")}
      ${todayBlocks.map(s=>{const cat=(s.category||"Content"); const cls="c-"+cat.toLowerCase().replace(/[^a-z]/g,"");
        return `<div class="trow"><b class="t">${esc(s.slot||s.start||"Anytime")}</b>
        <span class="tt">${esc((s.emoji?s.emoji+" ":"")+(s.title||s.what||""))} <span class="tag ${cls}" style="margin-left:6px;">${esc(cat)}</span>${s.channel?` <span class="tag ch" style="margin-left:4px;">${esc(s.channel)}</span>`:""}${s.owner?` <span class="muted">· ${esc(s.owner)}</span>`:""}</span></div>`;}).join("")}`
      : '<div class="empty">Nothing on the board for today. Enjoy the quiet or add blocks in the Schedule tab.</div>';
    V.innerHTML=`
      <span class="eyebrow">Welcome to ${MONTHS[now.getMonth()]}</span>
      <h1 class="big">Here's where the team stands</h1>
      <p class="sub">One home for the team: what we're creating, where it's going, and what we accomplished. Updates here save for the whole team.</p>
      <div class="stats">
        <div class="stat blue"><div class="chip">📚</div><b>${S.content.length}</b><span>Items in content bank</span></div>
        <div class="stat gold"><div class="chip">🚀</div><b>${pubM}</b><span>Completed</span></div>
        <div class="stat blue"><div class="chip">✅</div><b>${done}/${wk.length}</b><span>Tasks done this week</span></div>
        <div class="stat gold"><div class="chip">🙏</div><b>${daysTo===0?"Today":daysTo+" days"}</b><span>Monthly review · ${fmtShort(nextPd)}</span></div>
      </div>
      <div class="panel" style="margin-bottom:18px;"><h3>Today · ${dayName}, ${fmtShort(now)}</h3>${todayHtml}</div>
      <div class="panel" style="margin-bottom:18px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h3 style="margin:0;">🔗 Quick Links — event resources</h3>
          <button class="btn ghost tiny" id="ql-add">+ Add link</button>
        </div>
        ${S.quicklinks.length? QL_GROUPS.map(gp=>{
          const links=S.quicklinks.filter(l=>(l.group||QL_GROUPS[0])===gp);
          return `<div class="qgroup">
            <div class="qghead">${esc(gp)}</div>
            ${links.length? links.map(l=>`
              <div class="qrow">
                <div class="qinfo"><b>${esc(l.label)}</b>${l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener" class="qurl">${esc(l.url)}</a>`:'<span class="muted">No link yet — click edit to add one</span>'}</div>
                <div class="qacts">
                  ${l.url?`<button class="btn blue tiny" data-copy="${esc(l.url)}">Copy</button>`:""}
                  <button class="icon-btn ed" data-qedit="${l.id}" title="Edit">✎</button>
                  <button class="icon-btn" data-qdel="${l.id}" title="Remove">✕</button>
                </div>
              </div>`).join("") : '<div class="muted" style="padding:8px 4px;">No links in this channel yet.</div>'}
          </div>`;}).join("")
        : '<div class="empty">No quick links yet. Add your Drive folders, Canva, and other upload destinations.</div>'}
      </div>
      <div class="grid-2">
        <div class="panel"><h3>Latest Friday notes</h3>
          ${recent.length? recent.map(n=>`<div style="padding:12px 0; border-bottom:1px solid var(--line);">
            <b style="font-size:13px;">${esc(n.author)}</b> <span class="muted">· ${esc(n.weekLabel)}</span>
            <p style="font-size:13px; margin-top:5px; color:#3A3D47; line-height:1.55;">${esc(n.text.length>140?n.text.slice(0,140)+"…":n.text)}</p></div>`).join("")
          : '<div class="empty">No notes yet. The first Friday note starts the tradition.</div>'}
        </div>
        <div class="panel"><h3>This week at a glance</h3>
          <p class="muted" style="margin-bottom:10px;">${weekLabel(S.weekMon)}</p>
          ${wk.length? wk.slice(0,6).map(t=>`<div class="task ${t.done?"done":""}"><input type="checkbox" disabled ${t.done?"checked":""}><span>${esc(t.text)} <span class="muted">· ${esc(t.member)}</span></span></div>`).join("")
          : '<div class="empty">No tasks logged this week yet.</div>'}
          <div style="margin-top:14px;"><button class="btn blue tiny" id="go-tasks">Open weekly tasks</button></div>
        </div>
      </div>`;
    const g=V.querySelector("#go-tasks"); if(g) g.onclick=()=>{S.view="tasks"; render();};
    V.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
      const url=b.dataset.copy;
      try{await navigator.clipboard.writeText(url); toast("Link copied");}
      catch(e){const ta=document.createElement("textarea"); ta.value=url; document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); toast("Link copied");}catch(e2){toast("Copy failed");} document.body.removeChild(ta);}
    });
    const qlSave=async()=>{await sSet("ow:quicklinks",S.quicklinks); render();};
    V.querySelector("#ql-add").onclick=()=>qlModal();
    V.querySelectorAll("[data-qedit]").forEach(b=>b.onclick=()=>qlModal(S.quicklinks.find(l=>l.id===b.dataset.qedit)));
    V.querySelectorAll("[data-qdel]").forEach(b=>b.onclick=async()=>{S.quicklinks=S.quicklinks.filter(l=>l.id!==b.dataset.qdel); await qlSave();});
  }
  function qlModal(l){
    l=l||{};
    openModal(`<h3>${l.id?"Edit quick link":"Add quick link"}</h3>
      <label class="f">Channel</label><select id="ql-group">${QL_GROUPS.map(g=>`<option ${g===(l.group||QL_GROUPS[0])?"selected":""}>${g}</option>`).join("")}</select>
      <label class="f">Label</label><input type="text" id="ql-label" value="${esc(l.label||"")}" placeholder="e.g. 01 Raw Footage">
      <label class="f">Link</label><input type="text" id="ql-url" value="${esc(l.url||"")}" placeholder="https://drive.google.com/...">`,
      async()=>{const lb=mv("ql-label"); if(!lb){toast("Add a label"); return false;}
        const item={id:l.id||uid(),group:mv("ql-group"),label:lb,url:mv("ql-url")};
        const i=S.quicklinks.findIndex(x=>x.id===item.id);
        if(i>-1) S.quicklinks[i]=item; else S.quicklinks.push(item);
        await sSet("ow:quicklinks",S.quicklinks); render();},l.id?"Save":"Add link");
  }

  /* ---------- Weekly schedule board ---------- */
  async function vSchedule(){
    await ensure(["schedule","team"]);
    const todayIdx=(new Date().getDay()+6)%7;
    V.innerHTML=`
      <div class="section-head"><div><span class="eyebrow">Rhythm</span><h1 class="big">Weekly Schedule</h1>
      <p class="sub">Six slots per day — 6 AM through 6 PM. Each block is a to do for that slot. Click a slot's + to fill it; hover a card to edit or remove it.</p></div>
      <div style="display:flex; gap:10px; align-items:center;">
        <select id="s-filter" style="width:auto; background:var(--card); box-shadow:var(--shadow); border:0;"><option value="">Everyone</option>${teamOpts(S.schedOw)}</select>
        <button class="btn amber" id="add-s">+ Add block</button>
      </div></div>
      <div class="sched">${DAYS.map((day,i)=>{
        let dayBlocks=S.schedule.filter(s=>s.day===day);
        if(S.schedOw) dayBlocks=dayBlocks.filter(s=>s.owner===S.schedOw);
        const other=dayBlocks.filter(s=>!TIMES.includes(s.slot));
        const total=dayBlocks.length;
        const blockCard=s=>{
          const cat=(s.category||"Content");
          const cls="c-"+cat.toLowerCase().replace(/[^a-z]/g,"");
          const title=(s.emoji? s.emoji+" ":"")+(s.title||s.what||"");
          return `<div class="slot ${cls}">
            <span class="tools2"><button class="icon-btn ed" data-edit="${s.id}">✎</button><button class="icon-btn" data-del="${s.id}">✕</button></span>
            <div class="ti">${esc(title)}</div>
            <span class="tag ${cls}">${esc(cat)}</span>${s.channel?` <span class="tag ch">${esc(s.channel)}</span>`:""}
            ${s.owner?`<div class="muted" style="margin-top:6px;">${esc(s.owner)}</div>`:""}
          </div>`;};
        return `<div class="sday ${i===todayIdx?"now":""}">
          <h4><span class="dpill">${day}</span><span class="cnt">${total}</span></h4>
          ${TIMES.map(t=>{
            const slots=dayBlocks.filter(s=>s.slot===t);
            return `<div class="tslot">
              <div class="tlabel"><span>${t}</span><button data-slotadd="${day}|${t}" title="Add to ${t}">+</button></div>
              ${slots.map(blockCard).join("")}
            </div>`;}).join("")}
          ${other.length? `<div class="tslot"><div class="tlabel"><span>Other</span><span></span></div>${other.map(blockCard).join("")}</div>`:""}
        </div>`;}).join("")}</div>`;

  /* ---------- Calendar ---------- */
  async function vCal(){
    await ensure(["events"]);
    const y=S.calY, m=S.calM;
    const pd=ymd(lastSunday(y,m));
    const first=new Date(y,m,1);
    const startOffset=(first.getDay()+6)%7;
    const dim=new Date(y,m+1,0).getDate();
    const today=ymd(new Date());
    let cells="";
    const dows=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    for(const d of dows) cells+=`<div class="dow">${d}</div>`;
    for(let i=0;i<startOffset;i++) cells+=`<div class="day out"></div>`;
    for(let d=1; d<=dim; d++){
      const key=ymd(new Date(y,m,d));
      const evs=S.events.filter(e=>e.date===key);
      cells+=`<div class="day ${key===today?"today":""} ${key===pd?"prayer":""}" data-d="${key}">
        <span class="n">${d}</span>
        ${evs.map(e=>`<span class="ev" title="${esc(e.title)}">${esc(e.title)}</span>`).join("")}
      </div>`;
    }
    V.innerHTML=`
      <div class="section-head"><div><span class="eyebrow">Plan</span><h1 class="big">Content Calendar</h1>
      <p class="sub">A monthly review is auto-marked on the last Sunday of each month. Click any date to add a posting or event.</p></div>
      <button class="btn amber" id="add-ev">+ Add to calendar</button></div>
      <div class="panel">
        <div class="cal-head">
          <button class="btn ghost tiny" id="prev">‹</button>
          <span class="cal-title">${MONTHS[m]} ${y}</span>
          <button class="btn ghost tiny" id="next">›</button>
          <button class="btn ghost tiny" id="tod">Today</button>
        </div>
        <div class="cal">${cells}</div>
      </div>`;
    V.querySelector("#prev").onclick=()=>{S.calM--; if(S.calM<0){S.calM=11;S.calY--;} render();};
    V.querySelector("#next").onclick=()=>{S.calM++; if(S.calM>11){S.calM=0;S.calY++;} render();};
    V.querySelector("#tod").onclick=()=>{const n=new Date(); S.calY=n.getFullYear(); S.calM=n.getMonth(); render();};
    V.querySelector("#add-ev").onclick=()=>evModal(ymd(new Date(y,m,1)));
    V.querySelectorAll(".day[data-d]").forEach(el=>el.addEventListener("click",e=>{if(e.target.closest(".ev"))return; evModal(el.dataset.d);}));
  }

  /* ---------- Content bank ---------- */

              <div class="kt">${esc(r.title)}</div>

      }

    const qEl=V.querySelector("#f-q");

    V.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{S.content=S.content.filter(c=>c.id!==b.dataset.del); await sSet("ow:content",S.content); render();});

    // stage move buttons (mobile / no-drag)
    const moveTo=async(id,dir)=>{const it=S.content.find(c=>c.id===id); if(!it)return; const i=STATUSES.indexOf(it.status); const ni=i+dir; if(ni<0||ni>=STATUSES.length)return; it.status=STATUSES[ni]; await sSet("ow:content",S.content); render();};
    V.querySelectorAll("[data-fwd]").forEach(b=>b.onclick=()=>moveTo(b.dataset.fwd,1));
    V.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>moveTo(b.dataset.back,-1));
    V.querySelectorAll("[data-prog]").forEach(b=>b.onclick=async(e)=>{
      e.stopPropagation();
      const it=S.content.find(c=>c.id===b.dataset.prog); if(!it)return;
      const cur=PROGRESS.indexOf(it.progress||"To Do");
      it.progress=PROGRESS[(cur+1)%PROGRESS.length];
      await sSet("ow:content",S.content); render();
    });

    // drag and drop
    if(S.bankView==="board"){
      V.querySelectorAll(".kcard").forEach(card=>{
        card.addEventListener("dragstart",e=>{if(e.target.closest("a,button")){e.preventDefault();return;} dragId=card.dataset.card; card.classList.add("drag"); e.dataTransfer.effectAllowed="move";});
        card.addEventListener("dragend",()=>{dragId=null; card.classList.remove("drag");});

        col.addEventListener("dragover",e=>{e.preventDefault(); col.classList.add("over");});

        col.addEventListener("drop",async e=>{
          e.preventDefault(); col.classList.remove("over");

  /* ---------- Analytics ---------- */
  function delta(cur,prev){
    if(prev==null) return "";
    if(prev===0) return cur>0? '<span class="delta up">new</span>':'<span class="delta flat">—</span>';
    const p=Math.round((cur-prev)/prev*100);
    if(p>0) return `<span class="delta up">+${p}%</span>`;
    if(p<0) return `<span class="delta down">${p}%</span>`;
    return '<span class="delta flat">0%</span>';
  }
  async function vAnalytics(){
    await ensure(["analytics"]);
    const metrics=[["views","Views / reach"],["followers","Followers / subs"],["engagement","Engagement"]];
    const rows=S.analytics.filter(a=>a.channel===S.chartCh).sort((a,b)=>a.month.localeCompare(b.month));
    const last6=rows.slice(-6);
    const vals=last6.map(r=>Number(r[S.chartMetric])||0);
    const max=Math.max(...vals,1);
    const cur=rows[rows.length-1], prev=rows[rows.length-2];
    const miniHtml=cur? `<div class="mini">
        ${metrics.map(m=>`<div class="m"><b>${Number(cur[m[0]]||0).toLocaleString()}</b>${prev? delta(Number(cur[m[0]]||0),Number(prev[m[0]]||0)):""}<span>${m[1]} · ${esc(cur.month)}</span></div>`).join("")}
      </div>`:"";
    V.innerHTML=`
      <div class="section-head"><div><span class="eyebrow">Track</span><h1 class="big">Analytics Center</h1>
      <p class="sub">Log each channel's numbers monthly and watch the trend build through the year.</p></div>
      <button class="btn amber" id="add-a">+ Log numbers</button></div>
      <div class="panel">
        <div class="filters" style="margin-bottom:10px;">
          <select id="a-ch">${chOpts(S.chartCh)}</select>
          <select id="a-met">${metrics.map(m=>`<option value="${m[0]}" ${m[0]===S.chartMetric?"selected":""}>${m[1]}</option>`).join("")}</select>
        </div>
        ${miniHtml}
        ${last6.length? `<div class="bars">${last6.map((r,i)=>`<div class="bar"><b>${vals[i].toLocaleString()}</b><i style="height:${Math.max(6,Math.round(vals[i]/max*136))}px;"></i></div>`).join("")}</div>
        <div class="bar-x">${last6.map(r=>`<span>${MONTHS[Number(r.month.slice(5,7))-1].slice(0,3)} ${r.month.slice(2,4)}</span>`).join("")}</div>`
        : `<div class="empty">No numbers logged for ${esc(S.chartCh)} yet. Log the first month to start the chart.</div>`}
      </div>
      <div class="panel" style="margin-top:18px; padding:10px 18px;">
        <table class="tbl"><thead><tr><th>Month</th><th>Channel</th><th>Views/Reach</th><th>Followers</th><th>Engagement</th><th>Notes</th><th></th></tr></thead>
        <tbody>${S.analytics.length? S.analytics.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(a=>`<tr>
          <td>${esc(a.month)}</td><td><span class="tag ch">${esc(a.channel)}</span></td>
          <td>${Number(a.views||0).toLocaleString()}</td><td>${Number(a.followers||0).toLocaleString()}</td><td>${Number(a.engagement||0).toLocaleString()}</td>
          <td class="muted">${esc(a.notes||"")}</td>
          <td style="white-space:nowrap;"><button class="btn ghost tiny" data-edit="${a.id}">Edit</button> <button class="icon-btn" data-del="${a.id}">✕</button></td></tr>`).join("")
        : `<tr><td colspan="7"><div class="empty">The log is empty for now.</div></td></tr>`}</tbody></table>
      </div>`;
    V.querySelector("#a-ch").onchange=e=>{S.chartCh=e.target.value; render();};
    V.querySelector("#a-met").onchange=e=>{S.chartMetric=e.target.value; render();};
    V.querySelector("#add-a").onclick=()=>logModal();
    V.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>logModal(S.analytics.find(a=>a.id===b.dataset.edit)));
    V.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{S.analytics=S.analytics.filter(a=>a.id!==b.dataset.del); await sSet("ow:analytics",S.analytics); render();});
  }
  function logModal(a){
    a=a||{};
    openModal(`<h3>${a.id?"Edit monthly numbers":"Log monthly numbers"}</h3>
      <div class="row"><div><label class="f">Channel</label><select id="l-ch">${chOpts(a.channel||S.chartCh)}</select></div>
      <div><label class="f">Month</label><input type="month" id="l-m" value="${esc(a.month||ymd(new Date()).slice(0,7))}"></div></div>
      <div class="row"><div><label class="f">Views / reach</label><input type="number" id="l-v" min="0" value="${esc(a.views||"")}" placeholder="0"></div>
      <div><label class="f">Followers / subs</label><input type="number" id="l-f" min="0" value="${esc(a.followers||"")}" placeholder="0"></div></div>
      <label class="f">Engagement (likes + comments + shares)</label><input type="number" id="l-e" min="0" value="${esc(a.engagement||"")}" placeholder="0">
      <label class="f">Notes</label><input type="text" id="l-n" value="${esc(a.notes||"")}" placeholder="What moved the numbers?">`,
      async()=>{if(!mv("l-m")){toast("Pick a month"); return false;}
        const item={id:a.id||uid(),channel:mv("l-ch"),month:mv("l-m"),views:mv("l-v"),followers:mv("l-f"),engagement:mv("l-e"),notes:mv("l-n")};
        const i=S.analytics.findIndex(x=>x.id===item.id);
        if(i>-1) S.analytics[i]=item; else S.analytics.push(item);
        await sSet("ow:analytics",S.analytics); render();},a.id?"Save changes":"Log it");
  }

  /* ---------- Team ---------- */
  async function vTeam(){
    await ensure(["team"]);
    V.innerHTML=`
      <div class="section-head"><div><span class="eyebrow">People</span><h1 class="big">Team & Roles</h1>
      <p class="sub">Who owns what. Edit any card as names and roles are confirmed.</p></div>
      <button class="btn amber" id="add-m">+ Add member</button></div>
      <div class="team-grid">${S.team.map(t=>`<div class="member">
        <div class="tools"><button class="btn ghost tiny" data-edit="${t.id}">Edit</button><button class="icon-btn" data-del="${t.id}">✕</button></div>
        <div class="avatar">${esc((t.name||"?").trim().charAt(0).toUpperCase())}</div>
        <h4>${esc(t.name)}</h4><div class="role">${esc(t.role)}</div>
        <p>${esc(t.duties)}</p>
      </div>`).join("")}</div>
      <div class="panel" style="margin-top:20px; max-width:420px;"><h3>🔒 Team PIN</h3>
      <p class="muted" style="margin-bottom:12px;">This PIN unlocks the hub for everyone. Change it here and share the new one with the team.</p>
      <div class="row" style="display:flex; gap:10px;"><input type="text" id="pin-new" placeholder="New PIN" style="flex:1;"><button class="btn blue" id="pin-save">Update PIN</button></div></div>`;
    V.querySelector("#add-m").onclick=()=>teamModal();
    V.querySelector("#pin-save").onclick=async()=>{
      const np=V.querySelector("#pin-new").value.trim();
      if(np.length<4){toast("Use at least 4 characters"); return;}
      await sSet("ow:pin",np); V.querySelector("#pin-new").value=""; toast("Team PIN updated");
    };
    V.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>teamModal(S.team.find(t=>t.id===b.dataset.edit)));
    V.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{S.team=S.team.filter(t=>t.id!==b.dataset.del); await sSet("ow:team",S.team); render();});
  }
  function teamModal(t){
    t=t||{};
    openModal(`<h3>${t.id?"Edit member":"Add member"}</h3>
      <label class="f">Name</label><input type="text" id="t-name" value="${esc(t.name||"")}">
      <label class="f">Role</label><input type="text" id="t-role" value="${esc(t.role||"")}" placeholder="e.g. Video Editor">
      <label class="f">Responsibilities</label><textarea id="t-duties" rows="3">${esc(t.duties||"")}</textarea>`,
      async()=>{const n=mv("t-name"); if(!n){toast("Add a name first"); return false;}
        const item={id:t.id||uid(),name:n,role:mv("t-role")||"Role to confirm",duties:mv("t-duties")};
        const i=S.team.findIndex(x=>x.id===item.id);
        if(i>-1) S.team[i]=item; else S.team.push(item);
        await sSet("ow:team",S.team); render();});
  }

  /* ---------- Weekly tasks ---------- */
  async function vTasks(){
    await ensure(["team"]); await ensure(["tasks"]);
    const k=ymd(S.weekMon); const list=S.tasks[k]||[];
    V.innerHTML=`
      <div class="section-head"><div><span class="eyebrow">Execute</span><h1 class="big">Weekly Tasks</h1>
      <p class="sub">Each person logs and checks off their tasks for the week. Everyone sees everyone's board.</p></div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn ghost tiny" id="w-prev">‹</button>
        <b style="font:800 13.5px 'Plus Jakarta Sans',sans-serif;">${weekLabel(S.weekMon)}</b>
        <button class="btn ghost tiny" id="w-next">›</button>
        <button class="btn ghost tiny" id="w-now">This week</button>
      </div></div>
      <div class="task-cols">${S.team.map(t=>{
        const mine=list.filter(x=>x.member===t.name);
        const d=mine.filter(x=>x.done).length;
        return `<div class="tcol"><h4>${esc(t.name)} <em>${d}/${mine.length}</em></h4>
          <div class="pbar"><i style="width:${mine.length? Math.round(d/mine.length*100):0}%;"></i></div>
          ${mine.map(x=>`<div class="task ${x.done?"done":""}"><input type="checkbox" data-tgl="${x.id}" ${x.done?"checked":""}><span>${esc(x.text)}</span><button class="icon-btn" data-del="${x.id}">✕</button></div>`).join("")||'<div class="muted" style="padding:4px 8px;">No tasks yet this week.</div>'}
          <div class="addline"><input type="text" placeholder="Add a task…" data-add="${esc(t.name)}"><button class="btn blue tiny" data-addbtn="${esc(t.name)}">Add</button></div>
        </div>`;}).join("")}</div>`;
    const shift=async(d)=>{const m=new Date(S.weekMon); m.setDate(m.getDate()+d); S.weekMon=m; render();};
    V.querySelector("#w-prev").onclick=()=>shift(-7);
    V.querySelector("#w-next").onclick=()=>shift(7);
    V.querySelector("#w-now").onclick=()=>{S.weekMon=mondayOf(new Date()); render();};
    const save=async()=>{S.tasks[k]=list; await sSet("ow:tasks:"+k,list);};
    V.querySelectorAll("[data-tgl]").forEach(cb=>cb.onchange=async()=>{const t=list.find(x=>x.id===cb.dataset.tgl); if(t){t.done=cb.checked; await save(); render();}});
    V.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const i=list.findIndex(x=>x.id===b.dataset.del); if(i>-1){list.splice(i,1); await save(); render();}});
    const addTask=async(name,inp)=>{const v=inp.value.trim(); if(!v)return; list.push({id:uid(),member:name,text:v,done:false}); inp.value=""; await save(); render();};
    V.querySelectorAll("[data-addbtn]").forEach(b=>b.onclick=()=>addTask(b.dataset.addbtn,V.querySelector(`[data-add="${CSS.escape(b.dataset.addbtn)}"]`)));
    V.querySelectorAll("[data-add]").forEach(inp=>inp.addEventListener("keydown",e=>{if(e.key==="Enter")addTask(inp.dataset.add,inp);}));
  }

  /* ---------- Friday notes ---------- */
  async function vNotes(){
    await ensure(["team","notes"]);
    V.innerHTML=`
      <div class="section-head"><div><span class="eyebrow">Celebrate</span><h1 class="big">Friday Week Notes</h1>
      <p class="sub">Every Friday, each person writes what they accomplished this week. Wins big and small belong here.</p></div>
      <div style="display:flex; gap:10px;">
        <button class="btn ghost" id="copy-n">Copy week summary</button>
        <button class="btn amber" id="add-n">+ Write my note</button>
      </div></div>
      <div class="notes-wall">${S.notes.length? S.notes.map(n=>`<div class="note">
        <div class="who">${esc(n.author)}</div><div class="wk">${esc(n.weekLabel)}</div>
        <p>${esc(n.text)}</p>
        <div style="text-align:right; margin-top:10px;"><button class="icon-btn" data-del="${n.id}">✕</button></div>
      </div>`).join(""): '<div class="empty" style="grid-column:1/-1;">No notes yet. Come back on Friday and start the wall.</div>'}</div>`;
    V.querySelector("#copy-n").onclick=async()=>{
      if(!S.notes.length){toast("No notes to copy yet"); return;}
      let wkKey=ymd(mondayOf(new Date()));
      let wkNotes=S.notes.filter(n=>n.weekKey===wkKey);
      if(!wkNotes.length){wkKey=S.notes[0].weekKey; wkNotes=S.notes.filter(n=>n.weekKey===wkKey);}
      const label=wkNotes[0].weekLabel;
      const text="the team – Week Notes ("+label+")\n\n"+wkNotes.map(n=>n.author+":\n"+n.text).join("\n\n");
      try{await navigator.clipboard.writeText(text); toast("Week summary copied");}
      catch(e){const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); toast("Week summary copied");}catch(e2){toast("Copy failed on this device");}
        document.body.removeChild(ta);}
    };
    V.querySelector("#add-n").onclick=()=>{
      const mon=mondayOf(new Date());
      openModal(`<h3>Friday week note</h3><p class="muted">${weekLabel(mon)}</p>
        <label class="f">Who's writing</label><select id="n-au">${teamOpts()}</select>
        <label class="f">What did you accomplish this week?</label><textarea id="n-txt" rows="5" placeholder="Finished the July newsletter, scheduled 6 reels, closed 2 Skool signups…"></textarea>`,
        async()=>{const txt=mv("n-txt"); if(!txt){toast("Write a little something first"); return false;}
          S.notes.unshift({id:uid(),author:mv("n-au"),weekLabel:weekLabel(mon),weekKey:ymd(mon),text:txt,ts:Date.now()});
          await sSet("ow:notes",S.notes); render();},"Post note");
    };
    V.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{S.notes=S.notes.filter(n=>n.id!==b.dataset.del); await sSet("ow:notes",S.notes); render();});
  }

  /* ================= PIN gate ================= */
  const DEFAULT_PIN="2000"; // client can change this anytime from inside the hub
  const gateEl=document.getElementById("gate");
  const SESSION_KEY="event-hub-unlocked";
  let started=false;
  function startApp(){ if(started) return; started=true; render(); startSync(); }
  async function getPin(){ const p=await sGet("ow:pin",null); return p||DEFAULT_PIN; }

  async function showGate(){
    gateEl.style.display="flex";
    const input=document.getElementById("gate-pin");
    const err=document.getElementById("gate-err");
    input.focus();
    const tryPin=async()=>{
      const entered=input.value.trim();
      const real=await getPin();
      if(entered===real){
        try{sessionStorage.setItem(SESSION_KEY,"1");}catch(e){}
        gateEl.style.display="none";
        startApp();
      } else {
        err.textContent="Incorrect PIN. Try again.";
        input.value=""; input.focus();
      }
    };
    document.getElementById("gate-go").onclick=tryPin;
    input.addEventListener("keydown",e=>{if(e.key==="Enter")tryPin();});
  }

  // already unlocked this session? skip the gate.
  let unlocked=false;
  try{unlocked=sessionStorage.getItem(SESSION_KEY)==="1";}catch(e){}
  if(unlocked){ startApp(); } else { showGate(); }

  // lock button: end the session and show the gate again
  document.getElementById("lock").onclick=()=>{
    try{sessionStorage.removeItem(SESSION_KEY);}catch(e){}
    location.reload();
  };

  /* ================= live sync ================= */
  function refreshData(){S.team=null;S.content=null;S.events=null;S.notes=null;S.analytics=null;S.schedule=null;S.quicklinks=null;S.tasks={}; render();}
  function startSync(){ /* template demo: no live sync */ }
})();
</script>
